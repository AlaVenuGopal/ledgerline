version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledgerline
      SPRING_DATASOURCE_USERNAME: ledgerline
      SPRING_DATASOURCE_PASSWORD: ledgerline
      SPRING_PROFILES_ACTIVE: postgres
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1:5173
      PORT: 8088
    depends_on:
      - db
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8088
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
