spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerline}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

ledgerline:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ledgerline-frontend-7fo1.onrender.com,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
